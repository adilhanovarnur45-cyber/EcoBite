    button, input, select { font: inherit; }
    h1, h2 { letter-spacing:-.02em; }
    ::selection { background:#BBF7D0; color:#0F172A; }
    :focus-visible { outline:2px solid #15803D !important; outline-offset:2px; }
    .glass { background:#fff; box-shadow:0 1px 2px rgba(15,23,42,.04), 0 12px 32px rgba(15,23,42,.07); }
    .lamp-glow, .lamp-off { box-shadow:none; }
    .ambient { display:none; }
    .soft-grid { background:none; }
    .darken { animation:none; }
    .fade-up { animation:fadeUp .4s ease both; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
    .page-enter { animation:pageEnter .25s ease both; }
    @keyframes pageEnter { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:none} }
    .progress-fill { transition:width .5s ease; }
    .chart-bar { transition:height .5s ease; }
    .toast { animation:toastIn .25s ease both; }
    @keyframes toastIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
    @media (max-width:640px){ input, select { font-size:16px !important; } }
    @media (prefers-reduced-motion:reduce){ *,*::before,*::after { animation:none !important; transition:none !important; scroll-behavior:auto !important; } }

function Icon({ name, size=18, color="currentColor", strokeWidth=2 }) {

function Button({children,onClick,variant="primary",className="",disabled=false,type="button",icon}) {
  const styles = {
    primary:{background:C.accent,color:"#fff",border:"1px solid transparent"},
    ghost:{background:"transparent",color:C.text,border:`1px solid ${C.border}`},
    subtle:{background:C.raised,color:C.text,border:`1px solid ${C.border}`},
    danger:{background:C.red,color:"#fff",border:"1px solid transparent"},
    blue:{background:"rgba(37,99,235,.12)",color:C.blue,border:"1px solid rgba(37,99,235,.25)"},
  };
  return (
    <button type={type} onClick={onClick} disabled={disabled}

  );
}

/* ---------------- AUTH + SIGNATURE LAMP ---------------- */

function AuthScreen({onAuth}) {
  const [mode,setMode]=useState("register");
  const [name,setName]=useState("");
  const [email,setEmail]=useState("");
  const [password,setPassword]=useState("");
  const [error,setError]=useState("");
  const [lampOn,setLampOn]=useState(true);
  const [pulling,setPulling]=useState(false);
  const [dark,setDark]=useState(false);
  const [busy,setBusy]=useState(false);

  const pullLamp=()=>{
    setPulling(true);
    setTimeout(()=>setPulling(false),220);
    setLampOn(v=>!v);
    if(lampOn) {
      setDark(true);
      setTimeout(()=>setDark(false),550);
    }
  };

  const submit=async(e)=>{
    e.preventDefault();
    if(mode==="register" && !name.trim()) return setError("Please enter your full name.");
    if(!email.trim() || !email.includes("@")) return setError("Please enter a valid email address.");
    if(!password.trim() || password.length<5) return setError("Password must be at least 5 characters.");
    setError("");
    setBusy(true);
    const r=mode==="register"?await sb.rpc("register_user",{p_name:name.trim(),p_email:email,p_password:password}):await sb.rpc("login_user",{p_email:email,p_password:password});
    setBusy(false);
    if(r.error) return setError(r.error.message);
    onAuth(r.data);
  };

  return (
    <div className={`min-h-screen relative overflow-hidden ${dark?"darken":""}`} style={{background:C.bg}}>
      <div className="absolute inset-0 soft-grid"></div>
      <div className="absolute -top-40 -left-40 w-96 h-96 rounded-full blur-3xl ambient" style={{background:"rgba(21,128,61,.07)"}}></div>
      <div className="absolute -bottom-40 -right-40 w-96 h-96 rounded-full blur-3xl ambient" style={{background:"rgba(37,99,235,.05)",animationDelay:"2s"}}></div>

      <div className="relative z-10 min-h-screen grid lg:grid-cols-[1.05fr_.95fr]">
        <div className="hidden lg:flex flex-col justify-between p-12 xl:p-16">
          <Logo />
          <div className="max-w-xl fade-up">
            <div className="inline-flex items-center gap-2 px-3 py-1.5 rounded-full mb-6"
              style={{background:"rgba(21,128,61,.08)",border:"1px solid rgba(21,128,61,.18)",color:C.accent,fontSize:12,fontWeight:700}}>
              <span className="w-1.5 h-1.5 rounded-full" style={{background:C.accent}}></span>
              FOOD WASTE INTELLIGENCE
            </div>
            <h1 style={{fontFamily:C.heading,fontSize:"clamp(38px,5vw,67px)",lineHeight:1.02,fontWeight:700,color:C.text}}>
              Measure today.<br/>
              <span style={{color:C.accent}}>Reduce tomorrow.</span>
            </h1>
            <p className="mt-6 max-w-lg" style={{fontSize:15,color:C.muted,lineHeight:1.75}}>
              EcoBite turns kitchen data into practical decisions — helping teams measure production,
              understand waste, predict demand, and prevent tomorrow's waste.
            </p>

            <div className="grid grid-cols-2 gap-3 mt-9 max-w-lg">
              {[
                ["measure","Measure","prepared, sold & wasted"],
                ["trending-up","Predict","future demand"],
                ["trending-down","Reduce","avoidable waste"],
                ["recycle","Rescue","safe surplus food"],
              ].map(([ic,t,d])=>(
                <div key={t} className="p-4 rounded-xl" style={{background:"#FFFFFF",border:`1px solid ${C.border}`}}>
                  <Icon name={ic} size={18} color={C.accent}/>
                  <div className="mt-3" style={{fontWeight:700,fontSize:13}}>{t}</div>
                  <div style={{fontSize:12,color:C.muted,marginTop:3}}>{d}</div>
                </div>
              ))}
            </div>
          </div>
          <div style={{fontSize:12,color:C.muted}}>© 2026 EcoBite · Smart Food Waste Reduction Platform</div>
        </div>

        <div className="flex items-center justify-center p-5 sm:p-8">
          <div className="w-full max-w-md">
            <div className="lg:hidden flex justify-center mb-7"><Logo/></div>

            <div className="rounded-xl p-6 sm:p-8 glass" style={{border:`1px solid ${C.border}`,boxShadow:"0 30px 100px rgba(15,23,42,.10)"}}>
              

              <div className="text-center mb-6">
                <div style={{fontFamily:C.heading,fontSize:23,fontWeight:700}}>{mode==="register"?"Create your account":"Welcome back"}</div>
                <div style={{fontSize:12.5,color:C.muted,marginTop:5}}>
                  {mode==="register"?"Start turning food data into smarter decisions.":"Continue managing your food intelligence."}
                </div>
              </div>

              <form onSubmit={submit} className="flex flex-col gap-4">
                {mode==="register" && (
                  <Field label="Full Name" value={name} onChange={setName} placeholder="Arnur Adilhanov" icon="user"/>
                )}
                <Field label="Email Address" value={email} onChange={setEmail} placeholder="manager@EcoBite.kz" type="email" icon="mail"/>
                <Field label="Password" value={password} onChange={setPassword} placeholder="••••••••" type="password" icon="lock"/>

                {error && (
                  <div className="px-3 py-2.5 rounded-lg" style={{background:"rgba(220,38,38,.08)",border:"1px solid rgba(220,38,38,.22)",color:C.red,fontSize:12}}>
                    {error}
                  </div>
                )}

                <Button type="submit" disabled={busy} className="w-full mt-1" icon={mode==="register"?"arrow-right":"log-in"}>
                  {mode==="register"?"Create EcoBite Account":"Sign In"}
                </Button>
              </form>

              <div className="flex items-center gap-3 my-6">
                <div className="h-px flex-1" style={{background:C.border}}></div>
                <span style={{fontSize:12,color:C.muted}}>OR</span>
                <div className="h-px flex-1" style={{background:C.border}}></div>
              </div>

              <button onClick={()=>{setMode(mode==="register"?"login":"register");setError("");}}
                className="w-full text-center cursor-pointer" style={{fontSize:12.5,color:C.muted}}>
                {mode==="register" ? <>Already have an account? <b style={{color:C.accent}}>Sign In</b></> :
                  <>New to EcoBite? <b style={{color:C.accent}}>Create Account</b></>}
              </button>
            </div>

            <div className="text-center mt-5" style={{fontSize:12,color:C.muted}}>
              Connected to Supabase · PostgreSQL
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function Field({label,value,onChange,placeholder,type="text",icon}) {
  return (
    <div>

      <div className="relative mt-1.5">

        <input type={type} value={value} placeholder={placeholder} onChange={e=>onChange(e.target.value)}
          className="w-full pl-10 pr-4 py-3 rounded-lg outline-none"
          style={{background:C.raised,border:`1px solid ${C.border}`,color:C.text,fontSize:13}}/>
      </div>
    </div>
  );
}

function MiniChart() {
  const {snap}=useContext(Ctx);
  const values=snap.trend&&snap.trend.length?snap.trend:[0];
  const max=Math.max(...values,1);
  return (
    <div className="h-44 flex items-end gap-2">
      {values.map((v,i)=>(
        <div key={i} className="flex-1 h-full flex flex-col justify-end items-center gap-2">
          <div className="w-full max-w-8 rounded-t-lg chart-bar" style={{height:`${v/max*82}%`,background:i===values.length-1?C.accent:"rgba(21,128,61,.28)"}}></div>
          <span style={{fontSize:12,color:C.muted}}>{i===13?"Today":`D${i+1}`}</span>
        </div>
      ))}
    </div>
  );
}

function Production({stats,setStats,toast}) {

            <InputField label="Optional Note" value={note} onChange={setNote} placeholder="Breakfast rush / normal day..."/>
            <Button onClick={add} icon="plus">Add Production Batch</Button>

          <div className="mt-5 p-3 rounded-lg" style={{background:C.raised,fontSize:12,color:C.muted,lineHeight:1.6}}>

/* ---------------- INVENTORY ---------------- */

function Inventory({toast}) {
  const {cafeId}=useContext(Ctx);
  const [items,reloadInv]=useQuery(async()=>need(await sb.from("inventory_items").select("*").eq("cafe_id",cafeId).order("inv_id")).map(r=>({id:r.inv_id,name:r.name,category:r.category||"Other",stock:Number(r.stock),unit:r.unit,min:Number(r.min_stock),expiry:r.expiry?new Date(r.expiry+"T00:00").toLocaleDateString("en",{month:"short",day:"2-digit"}):"—",soon:r.expiry?(new Date(r.expiry+"T00:00")-Date.now())/864e5<=1:false,status:Number(r.stock)<Number(r.min_stock)?"Low":"Good"})),[cafeId]);
  const [query,setQuery]=useState("");
  const [category,setCategory]=useState("All");
  const categories=["All",...new Set(items.map(x=>x.category))];

  const filtered=items.filter(x=>x.name.toLowerCase().includes(query.toLowerCase()) && (category==="All" || x.category===category));
  const restock=async(name)=>{
    const x=items.find(i=>i.name===name);
    try{ need(await sb.from("inventory_items").update({stock:x.min*2}).eq("inv_id",x.id)); await reloadInv(); toast(`${name} stock updated.`); }catch(e){toast(e.message)}
  };

  return (
    <div className="page-enter">
      <SectionTitle eyebrow="Resources" title="Inventory & Expiry" description="Know what is available, what is running low, and what should be used first."/>
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3.5 mb-4">
        <StatCard icon="package" label="Tracked Items" value={`${items.length}`} accent={C.accent}/>
        <StatCard icon="package-minus" label="Low Stock" value={`${items.filter(x=>x.status==="Low").length}`} accent={C.red}/>
        <StatCard icon="clock-3" label="Expiring Soon" value={`${items.filter(x=>x.soon).length}`} accent={C.amber}/>
        <StatCard icon="recycle" label="FEFO Status" value="Active" accent={C.blue}/>
      </div>
      <div className="p-5 rounded-xl" style={{background:C.surface,border:`1px solid ${C.border}`}}>
        <div className="flex flex-col sm:flex-row gap-3 justify-between mb-5">
          <div><h2 style={{fontFamily:C.heading,fontSize:15,fontWeight:600}}>Stock Monitor</h2><p style={{fontSize:12,color:C.muted}}>FEFO = First Expired, First Out</p></div>
          <div className="flex gap-2 items-center"><select value={category} onChange={e=>setCategory(e.target.value)} className="px-3 py-2 rounded-lg outline-none" style={{background:C.raised,border:`1px solid ${C.border}`,color:C.text,fontSize:12}}>{categories.map(c=><option key={c}>{c}</option>)}</select><div className="relative"><Icon name="search" size={14} color={C.muted}/><input value={query} onChange={e=>setQuery(e.target.value)} placeholder="Search ingredient..." className="pl-8 pr-3 py-2 rounded-lg outline-none" style={{width:180,background:C.raised,border:`1px solid ${C.border}`,color:C.text,fontSize:12}}/></div></div>
        </div>
        <div className="grid sm:grid-cols-2 xl:grid-cols-3 gap-3">
          {filtered.map(x=>(
            <div key={x.name} className="p-4 rounded-lg" style={{background:C.raised,border:`1px solid ${x.status==="Low"?"rgba(220,38,38,.25)":C.border}`}}>
              <div className="flex justify-between"><div><div style={{fontSize:12,fontWeight:700}}>{x.name}</div><div style={{fontSize:12,color:C.muted}}>{x.category}</div></div>
                <span className="px-2 py-1 rounded-lg" style={{fontSize:12,color:x.status==="Low"?C.red:C.accent,background:x.status==="Low"?"rgba(220,38,38,.08)":"rgba(21,128,61,.07)"}}>{x.status}</span></div>
              <div className="mt-4 flex items-end justify-between"><div><span style={{fontFamily:C.mono,fontSize:20,fontWeight:700}}>{x.stock}</span> <span style={{fontSize:12,color:C.muted}}>{x.unit}</span></div><div className="text-right"><div style={{fontSize:12,color:C.muted}}>Expiry</div><div style={{fontFamily:C.mono,fontSize:12}}>{x.expiry}</div></div></div>
              <div className="mt-3 h-1.5 rounded-full overflow-hidden" style={{background:"#E3E7EC"}}><div className="h-full rounded-full" style={{width:`${Math.min(100,x.stock/(x.min*2)*100)}%`,background:x.status==="Low"?C.red:C.accent}}></div></div>
              {x.status==="Low" && <button onClick={()=>restock(x.name)} className="mt-3 w-full py-2 rounded-lg cursor-pointer" style={{background:"rgba(21,128,61,.08)",color:C.accent,fontSize:12,fontWeight:600}}>Mark Restocked</button>}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ---------------- RECOMMENDATION ---------------- */

function Recommendation({stats,toast}) {
  const [scenario,setScenario]=useState(10);
  const [selected,setSelected]=useState(()=>FOOD_ITEMS[0]?.name||"");
  const [applied,setApplied]=useState(false);
  const item=FOOD_ITEMS.find(x=>x.name===selected)||FOOD_ITEMS[0];
  const recommended=Math.max(1,Math.round(item.sold*1.08));
  const projectedWaste=Math.max(0,item.waste*(1-scenario/100));
  const savedKg=(item.wasteKg*scenario/100).toFixed(1);
  const savedMoney=Math.round(Number(savedKg)*item.cost);
  const demandLow=item.sold < item.prepared*0.78;
  const risk=item.waste/item.prepared >= .20 ? "High" : item.waste/item.prepared >= .12 ? "Medium" : "Low";
  const riskColor=risk==="High"?C.red:risk==="Medium"?C.amber:C.accent;
  const reasonLines=[
    `Average sales over recent days: ${item.sold} portions`,
    `${item.name} currently has a ${Math.round(item.waste/item.prepared*100)}% waste rate`,
    demandLow ? "Demand is below the current production level" : "Demand is relatively stable", 
    `A small safety buffer is kept above recent demand: ${recommended} portions`,
    "Similar production patterns are used to avoid repeating overproduction"
  ];
  const {cafeId,user}=useContext(Ctx);
  const savePlan=async(portions,pct,msg)=>{
    try{ need(await sb.from("recommendation_plans").insert({cafe_id:cafeId,item_id:item.id,recommended_portions:portions,scenario_pct:pct,created_by:user.user_id})); setApplied(true); toast(msg); }catch(e){toast(e.message)}
  };
  const applyScenario=()=>savePlan(Math.max(1,Math.round(item.prepared*(1-scenario/100))),scenario,`${item.name}: ${Math.max(1,Math.round(item.prepared*(1-scenario/100)))}-portion plan saved.`);
  return (
    <div className="page-enter">
      <SectionTitle eyebrow="Intelligence" title="Smart Recommendation" description="Turn historical production and sales into a practical plan for tomorrow."
        action={<div className="px-3 py-2 rounded-lg flex items-center gap-2" style={{background:"rgba(21,128,61,.08)",color:C.accent,fontSize:12}}><Icon name="info" size={14}/> Rule-based forecast</div>}/>

      <div className="grid xl:grid-cols-[1.15fr_.85fr] gap-4">
        <div className="p-6 rounded-xl" style={{background:C.surface,border:`1px solid ${C.border}`}}>
          <div className="flex items-center justify-between gap-3">
            <div className="flex items-center gap-3">
              <div className="w-11 h-11 rounded-xl flex items-center justify-center" style={{background:"rgba(21,128,61,.10)"}}><Icon name="trending-up" size={21} color={C.accent}/></div>
              <div><div style={{fontFamily:C.heading,fontSize:16,fontWeight:700}}>Tomorrow's Production Plan</div><div style={{fontSize:12,color:C.muted}}>Based on recent sales + waste patterns</div></div>
            </div>
            <div className="px-2.5 py-1.5 rounded-full" style={{background:`${riskColor}15`,color:riskColor,fontSize:12,fontWeight:700}}>● {risk} waste risk</div>
          </div>
          <div className="mt-6"><SelectField label="Select Food Item" value={selected} onChange={(v)=>{setSelected(v);setApplied(false)}} options={FOOD_ITEMS.map(x=>x.name)}/></div>
          <div className="grid sm:grid-cols-3 gap-3 mt-5">
            <MetricBox label="Avg. sold" value={`${item.sold}`} sub="portions/day" accent={C.amber}/>
            <MetricBox label="Current prep" value={`${item.prepared}`} sub="portions/day" accent={C.red}/>
            <MetricBox label="Recommended" value={`${recommended}`} sub="portions tomorrow" accent={C.accent}/>
          </div>
          <div className="mt-5 p-4 rounded-lg" style={{background:C.raised,border:`1px solid ${C.border}`}}>
            <div className="flex items-start gap-3"><Icon name="lightbulb" size={18} color={C.accent}/><div style={{fontSize:12.5,lineHeight:1.7}}><b>Recommendation:</b> Prepare around <b style={{color:C.accent}}>{recommended} portions</b> of {item.name} tomorrow. This keeps a small safety buffer above recent demand without repeating the current overproduction level.</div></div>
          </div>
          <div className="mt-4 p-4 rounded-lg" style={{background:"rgba(37,99,235,.055)",border:`1px solid rgba(37,99,235,.18)`}}>
            <div className="flex items-center gap-2"><Icon name="help-circle" size={16} color={C.blue}/><span style={{fontFamily:C.heading,fontSize:12.5,fontWeight:700}}>Why this recommendation?</span></div>
            <div className="grid sm:grid-cols-2 gap-x-4 gap-y-2 mt-3">{reasonLines.map((x,i)=><div key={i} className="flex gap-2" style={{fontSize:12,color:C.muted,lineHeight:1.5}}><span style={{color:C.blue}}>•</span><span>{x}</span></div>)}</div>
          </div>
          <Button className="w-full mt-4" onClick={()=>savePlan(recommended,0,"Recommendation accepted for tomorrow's plan.")} icon="check-circle">Accept Recommendation</Button>
          {applied && <div className="mt-3 px-3 py-2.5 rounded-lg flex items-center gap-2" style={{background:"rgba(21,128,61,.07)",border:`1px solid ${C.accentDim}`,fontSize:12,color:C.accent}}><Icon name="check-circle-2" size={14}/> Plan marked for tomorrow. Plan saved to the database.</div>}
        </div>

        <div className="p-6 rounded-xl" style={{background:C.surface,border:`1px solid ${C.border}`}}>
          <div className="flex items-center justify-between"><div><div style={{fontFamily:C.heading,fontSize:15,fontWeight:600}}>What-if Simulator</div><p className="mt-1" style={{fontSize:12,color:C.muted}}>Test a production reduction before changing the kitchen plan.</p></div><span className="px-2 py-1 rounded-lg" style={{background:"rgba(21,128,61,.08)",color:C.accent,fontSize:12}}>SIMULATOR</span></div>
          <div className="mt-7"><div className="flex justify-between" style={{fontSize:12}}><span>Reduce current production by</span><b style={{color:C.accent}}>{scenario}%</b></div><input type="range" min="0" max="30" value={scenario} onChange={e=>{setScenario(Number(e.target.value));setApplied(false)}} className="w-full mt-4" style={{accentColor:C.accent}}/></div>
          <div className="grid grid-cols-2 gap-3 mt-7">
            <MetricBox label="Projected waste" value={`${projectedWaste.toFixed(1)}`} sub="portions" accent={C.red}/>
            <MetricBox label="Waste saved" value={`${savedKg}`} sub="kg / day" accent={C.accent}/>
            <MetricBox label="Est. cost saved" value={`${savedMoney.toLocaleString()} ₸`} sub="per day" accent={C.amber}/>
            <MetricBox label="Annualized*" value={`${Math.round(savedMoney*300/1000)}k ₸`} sub="illustrative" accent={C.blue}/>
          </div>
          <div className="mt-5 p-3 rounded-lg" style={{background:C.raised,border:`1px solid ${C.border}`}}><div className="flex items-center gap-2" style={{fontSize:12,fontWeight:700}}><Icon name="calculator" size={14} color={C.accent}/> Scenario result</div><div className="mt-2" style={{fontSize:12,color:C.muted,lineHeight:1.6}}>Production: <b style={{color:C.text}}>{item.prepared} → {Math.max(1,Math.round(item.prepared*(1-scenario/100)))} portions</b> · Waste reduction: <b style={{color:C.accent}}>{scenario}%</b></div></div>
          <Button className="w-full mt-4" onClick={applyScenario} icon="check-circle" variant="subtle">Apply Recommendation</Button>
          <div className="mt-3" style={{fontSize:12,color:C.muted}}>*Projection only. Real results depend on actual records and operating days.</div>
        </div>
      </div>

      <div className="grid lg:grid-cols-3 gap-4 mt-4">
        <div className="p-5 rounded-xl" style={{background:C.surface,border:`1px solid ${riskColor}35`}}><div className="flex items-center gap-2"><Icon name="triangle-alert" size={17} color={riskColor}/><div style={{fontFamily:C.heading,fontSize:13,fontWeight:700}}>Waste Risk Alert</div></div><div className="mt-3" style={{fontSize:12,color:C.muted,lineHeight:1.6}}><b style={{color:riskColor}}>{risk} risk:</b> {item.name} may create avoidable waste if production stays at {item.prepared} portions.</div><button onClick={()=>setScenario(Math.min(30,Math.max(10,Math.round((item.waste/item.prepared)*100))))} className="mt-4 cursor-pointer" style={{fontSize:12,color:C.accent}}>Simulate safer plan →</button></div>
        <FeatureCard icon="calendar-days" title="Day-of-week factor" text="Different demand patterns can be stored for Monday, Friday, weekends and special events."/>
        <FeatureCard icon="shopping-basket" title="Smart purchasing" text="Production + inventory + predicted demand can suggest how much to purchase."/>
      </div>  
    </div>
  );
}

      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3.5">
        <StatCard icon="database" label="Records Analyzed" value={`${A.records||0}`} sub="+84" accent={C.accent}/>
        <StatCard icon="trash-2" label="Waste This Period" value={`${totalWaste.toFixed(1)} kg`} sub="-18%" accent={C.red}/>
        <StatCard icon="coins" label="Estimated Loss" value={`${Math.round(A.stats.loss||0).toLocaleString()} ₸`} sub="-14%" accent={C.amber}/>
        <StatCard icon="target" label="Goal Progress" value="72%" sub="+9%" accent={C.blue}/>

      <div className="grid xl:grid-cols-[1.25fr_.75fr] gap-4 mt-4">
        <div className="p-5 rounded-xl" style={{background:C.surface,border:`1px solid ${C.border}`}}>
          <div className="mb-5"><h2 style={{fontFamily:C.heading,fontSize:15,fontWeight:600}}>Waste by Food Item</h2><p style={{fontSize:12,color:C.muted}}>Kilograms recorded in the selected period</p></div>
          <div className="flex flex-col gap-4">
            {items.map(f=><div key={f.id} className="flex items-center gap-3"><div className="w-28 shrink-0" style={{fontSize:12}}>{f.name}</div><div className="flex-1 h-7 rounded-lg overflow-hidden relative" style={{background:C.raised}}><div className="h-full rounded-lg" style={{width:`${f.wasteKg/Math.max(...items.map(x=>x.wasteKg),1)*100}%`,background:"rgba(220,38,38,.72)"}}></div><span className="absolute right-2 top-1/2 -translate-y-1/2" style={{fontFamily:C.mono,fontSize:12}}>{f.wasteKg} kg</span></div></div>)}
          </div>
        </div>
        <div className="p-5 rounded-xl" style={{background:C.surface,border:`1px solid ${C.border}`}}>
          <div style={{fontFamily:C.heading,fontSize:15,fontWeight:600}}>Waste Reasons</div>
          <div className="mt-6 flex justify-center"><Donut parts={A.reasons.slice(0,4).map((r,i)=>[r.pct,[C.red,C.amber,C.blue,C.purple][i]])}/></div>
          <div className="grid grid-cols-2 gap-2 mt-5">{A.reasons.slice(0,4).map((r,i)=>[r.reason,r.pct,[C.red,C.amber,C.blue,C.purple][i]]).map(([t,v,c])=><div key={t} className="flex items-center gap-2"><span className="w-2 h-2 rounded-full" style={{background:c}}></span><span style={{fontSize:12,color:C.muted}}>{t}</span><span className="ml-auto" style={{fontFamily:C.mono,fontSize:12}}>{v}%</span></div>)}</div>
        </div>
      </div>
      <div className="grid md:grid-cols-3 gap-4 mt-4">
        <Insight title="Best opportunity" text="Chicken Rice contributes the largest share of avoidable waste. Reduce tomorrow's batch first." icon="target"/>
        <Insight title="Pattern detected" text="Waste increases after the lunch peak. End-of-service batch sizing should be reviewed." icon="activity"/>
        <Insight title="Financial signal" text="Small daily production changes can reduce repeated ingredient and labor losses." icon="coins"/>
      </div>
    </div>
  );
}

function Donut({parts=[]}) {
  let a=0; const g=parts.length?parts.map(([p,c])=>{const t=`${c} ${a}% ${a+p}%`;a+=p;return t}).join(","):"#27352B 0 100%";
  return <div className="w-36 h-36 rounded-full relative flex items-center justify-center" style={{background:`conic-gradient(${g})`}}><div className="w-24 h-24 rounded-full flex flex-col items-center justify-center" style={{background:C.surface}}><span style={{fontFamily:C.mono,fontSize:18,fontWeight:700}}>100%</span><span style={{fontSize:12,color:C.muted}}>classified</span></div></div>;
}
function Insight({title,text,icon}) {
  return <div className="p-5 rounded-xl" style={{background:C.surface,border:`1px solid ${C.border}`}}><Icon name={icon} size={18} color={C.accent}/><div className="mt-3" style={{fontFamily:C.heading,fontSize:12.5,fontWeight:600}}>{title}</div><p className="mt-2" style={{fontSize:12,color:C.muted,lineHeight:1.65}}>{text}</p></div>;
}

function Admin({toast}) {

  const [users,reloadU]=useQuery(async()=>need(await sb.from("users").select("user_id,name,email,role,status").order("user_id")),[]);
  const toggle=async(u)=>{

  };
  const addUser=async()=>{
    const name=prompt("Full name?"); const email=name&&prompt("Email?"); const pw=email&&prompt("Password (min 5 characters)?");
    if(!pw) return;
    const r=await sb.rpc("register_user",{p_name:name,p_email:email,p_password:pw,p_role:"kitchen"});
    if(r.error) return toast(r.error.message);
    await reloadU(); toast("User created.");
  };
  return (
    <div className="page-enter">
      <SectionTitle eyebrow="System Control" title="Administration" description="Manage access, users and system activity."/>
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3.5 mb-4">
        <StatCard icon="users" label="Users" value={`${users.length}`} accent={C.accent}/>
        <StatCard icon="shield-check" label="Active" value={`${users.filter(x=>x.status==="Active").length}`} accent={C.blue}/>
        <StatCard icon="database" label="Audit Events" value={`${snap.records||0}`} accent={C.amber}/>
        <StatCard icon="server" label="Database" value="Ready" accent={C.accent}/>
      </div>
      <div className="p-5 rounded-xl" style={{background:C.surface,border:`1px solid ${C.border}`}}>
        <div className="flex justify-between mb-4"><div><h2 style={{fontFamily:C.heading,fontSize:15,fontWeight:600}}>User Access</h2><p style={{fontSize:12,color:C.muted}}>Live users from the database.</p></div><Button icon="user-plus" onClick={addUser}>Add User</Button></div>
        <div className="overflow-x-auto"><table className="w-full"><thead><tr style={{fontSize:12,color:C.muted,borderBottom:`1px solid ${C.border}`}}><th className="text-left pb-3">USER</th><th className="text-left pb-3">EMAIL · ROLE</th><th className="text-left pb-3">STATUS</th><th className="text-right pb-3">ACTION</th></tr></thead>
          <tbody>{users.map(u=><tr key={u.user_id} style={{borderBottom:`1px solid ${C.border}`}}><td className="py-3" style={{fontSize:12,fontWeight:600}}>{u.name}</td><td className="py-3" style={{fontSize:12,color:C.muted}}>{u.email} · {u.role}</td><td className="py-3"><span style={{fontSize:12,color:u.status==="Active"?C.accent:C.red}}>{u.status}</span></td><td className="py-3 text-right"><button onClick={()=>toggle(u)} className="px-2.5 py-1.5 rounded-lg cursor-pointer" style={{background:C.raised,color:C.muted,fontSize:12}}>{u.status==="Active"?"Pause":"Activate"}</button></td></tr>)}</tbody>
        </table></div>
      </div>
    </div>
  );
}

/* ---------------- HELPERS ---------------- */

function InputField({label,value,onChange,placeholder,type="text"}) {
  return <div><label style={{fontSize:12,color:C.muted}}>{label}</label><input type={type} value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} className="w-full mt-1.5 px-3.5 py-2.75 rounded-lg outline-none" style={{height:42,background:C.raised,border:`1px solid ${C.border}`,color:C.text,fontSize:12}}/></div>;
}
function SelectField({label,value,onChange,options}) {
  return <div><label style={{fontSize:12,color:C.muted}}>{label}</label><select value={value} onChange={e=>onChange(e.target.value)} className="w-full mt-1.5 px-3.5 rounded-lg outline-none" style={{height:42,background:C.raised,border:`1px solid ${C.border}`,color:C.text,fontSize:12}}>{options.map(x=><option key={x}>{x}</option>)}</select></div>;
}

/* ---------------- APP ---------------- */

function App() {
  const [authed,setAuthed]=useState(()=>!!ls.get("eb_user"));
  const [user,setUser]=useState(()=>ls.get("eb_user"));
  const [role,setRole]=useState(()=>ls.get("eb_role"));
  const [page,setPage]=useState("dashboard");
  const [toastMsg,setToastMsg]=useState("");
  const [cafes,setCafes]=useState([]);
  const [cafeId,setCafeId]=useState(null);
  const [snap,setSnap]=useState({items:[],stats:{},trend:[],reasons:[],records:0,cafe:null});
  const setStats=()=>{};
  const reload=async()=>{
    if(!cafeId) return;
    const r=await sb.rpc("app_snapshot",{p_cafe:cafeId,p_days:1});
    if(r.error) return toast(r.error.message);
    setSnap({...r.data,cafe:cafeId});
  };
  useEffect(()=>{
    if(!authed) return;
    sb.from("cafes").select("cafe_id,name").order("cafe_id").then(r=>{
      const l=r.data||[]; setCafes(l);
      const d=l.find(c=>c.name==="EcoBite Canteen")||l[0];
      if(d) setCafeId(c=>c||d.cafe_id);
    });
  },[authed]);
  useEffect(()=>{ reload(); },[cafeId]);
  const ss=snap.stats||{};
  const stats={prepared:ss.prepared||0,sold:ss.sold||0,wasteKg:ss.wasteKg||0,preparedKg:ss.preparedKg||0,revenue:ss.revenue||0,wasteRate:ss.preparedKg?Number((ss.wasteKg/ss.preparedKg*100).toFixed(1)):0};
  FOOD_ITEMS=snap.items||[];
  const ctx={cafes,cafeId,setCafeId,user,reload,snap};
  const [logs,setLogs]=useState(INITIAL_LOGS);

  const toast=(msg)=>{
    setToastMsg(msg);
    setTimeout(()=>setToastMsg(""),2800);
  };

  useEffect(()=>{
    if(window.lucide) window.lucide.createIcons();
  });

  useEffect(()=>{
    if(role==="kitchen" && ["sales","environment"].includes(page)) setPage("dashboard");
    if(role==="admin" && !["dashboard","inventory","analytics","admin"].includes(page)) setPage("dashboard");
  },[role]);

  if(!authed) return <AuthScreen onAuth={u=>{ls.set("eb_user",u);setUser(u);setAuthed(true)}}/>;
  if(!role) return <RoleSelect user={user} onPick={r=>{ls.set("eb_role",r);setRole(r);setPage("dashboard");sb.from("users").update({role:r}).eq("user_id",user.user_id).then(()=>{})}}/>;

  const logout=()=>{ls.set("eb_user",null);ls.set("eb_role",null);setAuthed(false);setRole(null);setUser(null);};
  const changeRole=()=>{ls.set("eb_role",null);setRole(null)};

  const renderPage=()=>{
    if(page==="dashboard") return <Dashboard stats={stats} logs={logs} setPage={setPage}/>;
    if(page==="production") return <Production stats={stats} setStats={setStats} toast={toast}/>;
    if(page==="sales") return <Sales stats={stats} setStats={setStats} toast={toast}/>;
    if(page==="waste") return <WasteLog stats={stats} setStats={setStats} logs={logs} setLogs={setLogs} toast={toast}/>;
    if(page==="inventory") return <Inventory toast={toast}/>;
    if(page==="recommendation") return <Recommendation stats={stats} toast={toast}/>;
    if(page==="environment") return <Environment stats={stats}/>;
    if(page==="analytics") return <Analytics stats={stats}/>;
    if(page==="admin") return <Admin toast={toast}/>;
    return <Dashboard stats={stats} logs={logs} setPage={setPage}/>;
  };

  return (
    <Ctx.Provider value={ctx}><div className="min-h-screen flex" style={{background:C.bg,color:C.text}}>
      <Sidebar active={page} setActive={setPage} role={role} onLogout={logout} onChangeRole={changeRole}/>
      <div className="flex-1 min-w-0">
        <TopBar user={user} role={role} onChangeRole={changeRole} onLogout={logout}/>
        <main className="px-4 sm:px-6 py-6 pb-24 lg:pb-8 max-w-[1450px] mx-auto" key={snap.cafe}>{snap.cafe===cafeId&&cafeId?renderPage():<div style={{color:C.muted,fontSize:13}}>Loading data from Supabase…</div>}</main>
      </div>
      <MobileNav active={page} setActive={setPage} role={role}/>

      {toastMsg && <div className="fixed right-4 bottom-20 lg:bottom-6 z-[80] toast px-4 py-3 rounded-lg flex items-center gap-2" style={{background:C.raised,border:`1px solid ${C.accentDim}`,boxShadow:"0 15px 50px rgba(15,23,42,.10)",fontSize:12}}><Icon name="check-circle-2" size={16} color={C.accent}/>{toastMsg}</div>}
    </div></Ctx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
